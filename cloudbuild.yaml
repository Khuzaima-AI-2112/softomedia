# Optimized Cloud Build configuration for softomedia-live-2026
# Leverages Docker multi-stage builds for isolation and stability

steps:
  # Step 0: Verify pre-deployment requirements & Secrets
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🔍 Running Pre-Deployment Verification..."
        node verify_predeploy.js

        if [ -z "${_VITE_FIREBASE_API_KEY}" ]; then
          echo "ERROR: _VITE_FIREBASE_API_KEY substitution is required"
          exit 1
        fi
    id: 'verify-predeploy'
    env:
      - 'PROJECT_ID=$PROJECT_ID'

  # Step 1: Build client-app image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_URL=${_VITE_API_URL}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_CLIENT}:$BUILD_ID'
      - '-f'
      - 'client-app/Dockerfile'
      - 'client-app'
    id: 'build-client-image'
    waitFor: ['verify-predeploy']

  # Step 2: Push client-app image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_CLIENT}:$BUILD_ID'
    id: 'push-client-image'
    waitFor: ['build-client-image']

  # Step 3: Build ad-server image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_ADSERVER}:$BUILD_ID'
      - '-f'
      - 'ad-server/Dockerfile'
      - 'ad-server'
    id: 'build-adserver-image'
    waitFor: ['verify-predeploy']

  # Step 4: Push ad-server image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_ADSERVER}:$BUILD_ID'
    id: 'push-adserver-image'
    waitFor: ['build-adserver-image']

  # Step 5: Deploy ad-server to Cloud Run with Health Check
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🚀 Deploying ${_SERVICE_ADSERVER} version: $BUILD_ID..."

        # Fetch both URL formats for the client-app and whitelist both
        # Cloud Run exposes two URL formats: hash-based (kiieh7nmwa) and project-number-based (524693967756)
        # We collect both to avoid CORS failures regardless of which URL the browser uses
        CLIENT_URL_PRIMARY=$$(gcloud run services describe ${_SERVICE_CLIENT} --region ${_REGION} --project ${PROJECT_ID} --format='value(status.url)' 2>/dev/null || echo "")
        CLIENT_URL_SECONDARY=$$(gcloud run services describe ${_SERVICE_CLIENT} --region ${_REGION} --project ${PROJECT_ID} --format='value(status.address.url)' 2>/dev/null || echo "")

        # Build CORS string — include both if they differ, fall back to wildcard if neither found
        if [ -z "$$CLIENT_URL_PRIMARY" ]; then
          CORS_VALUE="*"
        elif [ -n "$$CLIENT_URL_SECONDARY" ] && [ "$$CLIENT_URL_SECONDARY" != "$$CLIENT_URL_PRIMARY" ]; then
          CORS_VALUE="$$CLIENT_URL_PRIMARY,$$CLIENT_URL_SECONDARY"
        else
          CORS_VALUE="$$CLIENT_URL_PRIMARY"
        fi

        echo "📍 CORS origins will be: $$CORS_VALUE"

        gcloud run deploy ${_SERVICE_ADSERVER} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_ADSERVER}:$BUILD_ID \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars "NODE_ENV=production,CORS_ORIGINS=$$CORS_VALUE,BUILD_ID=$BUILD_ID" \
          --labels "version=$BUILD_ID,deployed-by=cloud-build"

        SERVICE_URL=$$(gcloud run services describe ${_SERVICE_ADSERVER} --region ${_REGION} --format='value(status.url)')
        echo "📍 Service URL: $$SERVICE_URL"

        echo "🩺 Polling /health until 200 OK..."
        for i in {1..30}; do
          HTTP_CODE=$$(curl -s -o /dev/null -w "%{http_code}" "$$SERVICE_URL/health")
          if [ "$$HTTP_CODE" = "200" ]; then
            echo "✅ Service is HEALTHY"
            exit 0
          fi
          echo "Attempt $$i/30: HTTP $$HTTP_CODE, waiting 2s..."
          sleep 2
        done
        echo "❌ Health check timed out!"
        exit 1
    id: 'deploy-adserver'
    waitFor: ['push-adserver-image']

  # Step 6: Deploy Firestore composite indexes
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "📦 Deploying Firestore composite indexes..."
        while IFS= read -r index; do
          gcloud firestore indexes composite create \
            --collection-group="$$(echo $$index | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["collectionGroup"])')" \
            --field-config="$$(echo $$index | python3 -c 'import sys,json; d=json.load(sys.stdin); print(",".join([f["fieldPath"]+":"+f["order"] for f in d["fields"]]))')" \
            --project=$PROJECT_ID 2>/dev/null || true
        done < <(python3 -c "import json,sys; data=json.load(open('ad-server/firestore.indexes.json')); [print(json.dumps(i)) for i in data.get('indexes',[])]")
        echo "✅ Firestore indexes step complete"
    id: 'deploy-indexes'
    allowFailure: true
    waitFor: ['verify-predeploy']

  # Step 7: Deploy Firestore security rules
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🔒 Deploying Firestore security rules..."
        npm install -g firebase-tools 2>/dev/null
        firebase deploy --only firestore:rules \
          --project=$PROJECT_ID \
          --non-interactive 2>/dev/null || echo "⚠️ Firestore rules deploy skipped (non-critical)"
    id: 'deploy-firestore-rules'
    allowFailure: true
    waitFor: ['verify-predeploy']

  # Step 8: Deploy client-app linked to backend, then lock CORS with both URL formats
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        burl=$$(gcloud run services describe ${_SERVICE_ADSERVER} --region ${_REGION} --format='value(status.url)' --project ${PROJECT_ID})

        echo "🚀 Deploying ${_SERVICE_CLIENT} linked to API: $$burl..."

        gcloud run deploy ${_SERVICE_CLIENT} \
          --image ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY}/${_SERVICE_CLIENT}:${BUILD_ID} \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --set-env-vars "VITE_API_URL=$$burl,VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY},VITE_FIREBASE_AUTH_DOMAIN=${PROJECT_ID}.firebaseapp.com,VITE_FIREBASE_PROJECT_ID=${PROJECT_ID},BUILD_ID=${BUILD_ID},NODE_ENV=production" \
          --labels "version=${BUILD_ID},deployed-by=cloud-build"

        # Collect both URL formats for the newly deployed client
        CLIENT_URL_PRIMARY=$$(gcloud run services describe ${_SERVICE_CLIENT} --region ${_REGION} --project ${PROJECT_ID} --format='value(status.url)')
        CLIENT_URL_SECONDARY=$$(gcloud run services describe ${_SERVICE_CLIENT} --region ${_REGION} --project ${PROJECT_ID} --format='value(status.address.url)' 2>/dev/null || echo "")

        if [ -n "$$CLIENT_URL_SECONDARY" ] && [ "$$CLIENT_URL_SECONDARY" != "$$CLIENT_URL_PRIMARY" ]; then
          CORS_VALUE="$$CLIENT_URL_PRIMARY,$$CLIENT_URL_SECONDARY"
        else
          CORS_VALUE="$$CLIENT_URL_PRIMARY"
        fi

        echo "🔄 Updating ad-server CORS_ORIGINS to: $$CORS_VALUE"
        gcloud run services update ${_SERVICE_ADSERVER} \
          --region ${_REGION} \
          --update-env-vars "CORS_ORIGINS=$$CORS_VALUE"
        echo "✅ CORS locked to $$CORS_VALUE"
    id: 'deploy-client'
    waitFor: ['deploy-adserver', 'push-client-image']

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REGISTRY: 'softomedia'
  _SERVICE_CLIENT: 'client-app'
  _SERVICE_ADSERVER: 'ad-server'
  _VITE_API_URL: ''          # Populated at runtime via entrypoint.sh; ARG pathway kept valid
  _VITE_FIREBASE_API_KEY: '' # Required Cloud Build trigger substitution

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_CLIENT}:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_ADSERVER}:$BUILD_ID'

timeout: 1200s
