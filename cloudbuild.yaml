# Optimized Cloud Build configuration for softomedia-live-2026
# Leverages Docker multi-stage builds for isolation and stability

steps:
  # Step 1: Verify pre-deployment requirements & Secrets
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🔍 Running Pre-Deployment Verification..."
        node verify_predeploy.js
        
        echo "🔐 Verifying Secrets..."
        for SECRET in JWT_SECRET; do
          if ! gcloud secrets describe "$$SECRET" --project=$PROJECT_ID &>/dev/null; then
            echo "ERROR: Secret '$$SECRET' not found in Secret Manager"
            exit 1
          fi
        done
    id: 'verify-predeploy'
    env:
      - 'PROJECT_ID=$PROJECT_ID'

  # Step 2: Build and push client-app container
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Fetch the live backend URL (fallback to hardcoded if first time)
        AD_SERVER_URL=$(gcloud run services describe ${_SERVICE_ADSERVER} --region ${_REGION} --format='value(status.url)' --project $PROJECT_ID 2>/dev/null || echo "https://ad-server-kiieh7nmwa-uc.a.run.app")
        echo "🔗 Linking frontend to Backend URL: $AD_SERVER_URL"
        
        docker build \
          --build-arg VITE_API_URL=$AD_SERVER_URL \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_CLIENT}:$BUILD_ID \
          -f client-app/Dockerfile \
          client-app
    id: 'build-client-image'
    waitFor: ['verify-predeploy']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_CLIENT}:$BUILD_ID'
    id: 'push-client-image'
    waitFor: ['build-client-image']

  # Step 3: Build and push ad-server container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_ADSERVER}:$BUILD_ID'
      - '-f'
      - 'ad-server/Dockerfile'
      - 'ad-server'
    id: 'build-adserver-image'
    waitFor: ['verify-predeploy']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_ADSERVER}:$BUILD_ID'
    id: 'push-adserver-image'
    waitFor: ['build-adserver-image']

  # Step 4: Deploy ad-server to Cloud Run with Health Check
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🚀 Deploying ${_SERVICE_ADSERVER} version: $BUILD_ID..."
        
        gcloud run deploy ${_SERVICE_ADSERVER} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_ADSERVER}:$BUILD_ID \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars "NODE_ENV=production,CORS_ORIGINS=*,BUILD_ID=$BUILD_ID" \
          --set-secrets "JWT_SECRET=JWT_SECRET:latest" \
          --labels "version=$BUILD_ID,deployed-by=cloud-build"
        
        SERVICE_URL=$$(gcloud run services describe ${_SERVICE_ADSERVER} --region ${_REGION} --format='value(status.url)')
        echo "📍 Service URL: $$SERVICE_URL"
        
        echo "🩺 Polling /health until 200 OK..."
        for i in {1..30}; do
          HTTP_CODE=$$(curl -s -o /dev/null -w "%{http_code}" "$$SERVICE_URL/health")
          if [ "$$HTTP_CODE" = "200" ]; then
            echo "✅ Service is HEALTHY"
            exit 0
          fi
          echo "Attempt $$i/30: HTTP $$HTTP_CODE, waiting 2s..."
          sleep 2
        done
        echo "❌ Health check timed out!"
        exit 1
    id: 'deploy-adserver'
    waitFor: ['push-adserver-image']

  # Step 5: Deploy Rules
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['firestore', 'indexes', 'import', 'ad-server/firestore.indexes.json']
    id: 'deploy-indexes'
    allowFailure: true
    waitFor: ['verify-predeploy']

  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['fire-rules', 'release', '--rules-file=ad-server/firestore.rules', '--project=$PROJECT_ID']
    id: 'deploy-firestore-rules'
    allowFailure: true
    waitFor: ['verify-predeploy']

  # Step 6: Deploy client-app linked to backend
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        AD_SERVER_URL=$$(gcloud run services describe ${_SERVICE_ADSERVER} --region ${_REGION} --format='value(status.url)')
        
        echo "🚀 Deploying ${_SERVICE_CLIENT} linked to API: $$AD_SERVER_URL..."
        
        gcloud run deploy ${_SERVICE_CLIENT} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_CLIENT}:$BUILD_ID \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars "VITE_API_URL=$$AD_SERVER_URL,BUILD_ID=$BUILD_ID" \
          --labels "version=$BUILD_ID,deployed-by=cloud-build"
    id: 'deploy-client'
    waitFor: ['deploy-adserver', 'push-client-image']

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REGISTRY: 'softomedia'
  _SERVICE_CLIENT: 'client-app'
  _SERVICE_ADSERVER: 'ad-server'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_CLIENT}:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY}/${_SERVICE_ADSERVER}:$BUILD_ID'

timeout: 1200s
