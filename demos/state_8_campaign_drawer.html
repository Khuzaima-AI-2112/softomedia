<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State 8: Campaign Upload Drawer | SoftoMedia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-bg-main: #f9fafb;
            --color-bg-card: #ffffff;
            --color-bg-hover: #f3f4f6;
            --color-primary: #6366f1;
            --color-primary-hover: #4f46e5;
            --color-error: #dc2626;
            --color-text-primary: #111827;
            --color-text-secondary: #6b7280;
            --color-text-tertiary: #9ca3af;
            --color-border: #e5e7eb;
            --font-body: 'Inter', sans-serif;
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --radius-md: 0.5rem;
            --shadow-md: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-bg-main);
        }

        .open-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background-color: var(--color-primary);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: var(--shadow-xl);
            z-index: 100;
        }

        .open-btn:hover {
            background-color: var(--color-primary-hover);
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            animation: fadeIn 0.25s;
        }

        .drawer {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 600px;
            max-width: 90vw;
            background-color: var(--color-bg-card);
            box-shadow: var(--shadow-xl);
            z-index: 1001;
            flex-direction: column;
            animation: slideInRight 0.3s;
        }

        .drawer.open,
        .overlay.open {
            display: flex;
        }

        .drawer-header {
            padding: var(--space-6);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-6);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            color: var(--color-text-secondary);
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--color-text-primary);
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: var(--space-2);
            color: var(--color-text-primary);
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: var(--space-3);
            font-size: 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            outline: none;
            font-family: var(--font-body);
        }

        input:focus {
            border-color: var(--color-primary);
        }

        .form-group {
            margin-bottom: var(--space-6);
        }

        .help-text {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            margin-top: var(--space-1);
        }

        .drop-zone {
            border: 2px dashed var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--space-8);
            text-align: center;
            background-color: var(--color-bg-hover);
            cursor: pointer;
            transition: all 0.25s;
        }

        .drop-zone.drag-active {
            border-color: var(--color-primary);
            background-color: rgba(99, 102, 241, 0.05);
        }

        .drop-zone:hover {
            border-color: var(--color-primary);
        }

        .actions {
            display: flex;
            gap: var(--space-3);
            justify-content: flex-end;
        }

        .btn-cancel {
            padding: var(--space-3) var(--space-6);
            font-size: 1rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            background-color: transparent;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            cursor: pointer;
        }

        .btn-publish {
            padding: var(--space-3) calc(var(--space-8) * 1);
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background-color: var(--color-primary);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.25s;
        }

        .btn-publish:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-publish:disabled {
            background-color: var(--color-text-tertiary);
            cursor: not-allowed;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>
    <button class="open-btn" onclick="openDrawer()">📤 Upload New Campaign</button>

    <div class="overlay" id="overlay" onclick="closeDrawer()"></div>

    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h2 style="font-size: 1.25rem; font-weight: 600;">Upload New Campaign</h2>
            <button class="close-btn" onclick="closeDrawer()">×</button>
        </div>

        <div class="drawer-content">
            <form onsubmit="handleSubmit(event)">
                <!-- Campaign Name -->
                <div class="form-group">
                    <label for="campaignName">Campaign Name *</label>
                    <input type="text" id="campaignName" placeholder="e.g., Holiday Sale 2025" required>
                </div>

                <!-- Duration -->
                <div class="form-group">
                    <label for="duration">Duration (seconds) *</label>
                    <input type="number" id="duration" value="30" min="5" max="60" required>
                    <p class="help-text">Recommended: 15-30 seconds</p>
                </div>

                <!-- Video Upload -->
                <div class="form-group" style="margin-bottom: var(--space-8);">
                    <label>Video File (1080p) *</label>
                    <div class="drop-zone" id="dropZone" ondragenter="handleDrag(event)"
                        ondragleave="handleDragLeave(event)" ondragover="handleDragOver(event)"
                        ondrop="handleDrop(event)" onclick="document.getElementById('fileInput').click()">
                        <input type="file" id="fileInput" accept="video/*" style="display: none;"
                            onchange="handleFileSelect(event)">
                        <div id="dropContent">
                            <p style="font-size: 3rem; margin-bottom: var(--space-2);">📁</p>
                            <p style="font-size: 1rem; font-weight: 500; color: var(--color-text-primary);">
                                Drag and drop your video here
                            </p>
                            <p
                                style="font-size: 0.875rem; color: var(--color-text-secondary); margin-top: var(--space-1);">
                                or click to browse
                            </p>
                            <p
                                style="font-size: 0.75rem; color: var(--color-text-tertiary); margin-top: var(--space-2);">
                                Supported: MP4, MOV, AVI (Max 500MB)
                            </p>
                        </div>
                        <div id="fileDisplay" style="display: none;">
                            <p style="font-size: 3rem; margin-bottom: var(--space-2);">🎥</p>
                            <p id="fileName"
                                style="font-size: 1rem; font-weight: 500; color: var(--color-text-primary);"></p>
                            <p id="fileSize"
                                style="font-size: 0.875rem; color: var(--color-text-secondary); margin-top: var(--space-1);">
                            </p>
                            <button type="button" onclick="removeFile(event)"
                                style="margin-top: var(--space-3); padding: var(--space-2) var(--space-4); font-size: 0.875rem; color: var(--color-error); background-color: transparent; border: 1px solid var(--color-error); border-radius: var(--radius-md); cursor: pointer;">
                                Remove
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="actions">
                    <button type="button" class="btn-cancel" onclick="closeDrawer()">Cancel</button>
                    <button type="submit" class="btn-publish" id="publishBtn" disabled>Publish Campaign</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let selectedFile = null;

        function openDrawer() {
            document.getElementById('overlay').classList.add('open');
            document.getElementById('drawer').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('overlay').classList.remove('open');
            document.getElementById('drawer').classList.remove('open');
        }

        function handleDrag(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('dropZone').classList.add('drag-active');
        }

        function handleDragLeave(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('dropZone').classList.remove('drag-active');
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('dropZone').classList.remove('drag-active');

            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('video/')) {
                setFile(files[0]);
            } else {
                alert('Please upload a video file');
            }
        }

        function handleFileSelect(e) {
            if (e.target.files.length > 0) {
                setFile(e.target.files[0]);
            }
        }

        function setFile(file) {
            selectedFile = file;
            document.getElementById('dropContent').style.display = 'none';
            document.getElementById('fileDisplay').style.display = 'block';
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
            document.getElementById('publishBtn').disabled = false;
        }

        function removeFile(e) {
            e.stopPropagation();
            selectedFile = null;
            document.getElementById('dropContent').style.display = 'block';
            document.getElementById('fileDisplay').style.display = 'none';
            document.getElementById('fileInput').value = '';
            document.getElementById('publishBtn').disabled = true;
        }

        function handleSubmit(e) {
            e.preventDefault();
            const campaignName = document.getElementById('campaignName').value;
            const duration = document.getElementById('duration').value;

            if (!selectedFile) {
                alert('Please select a video file');
                return;
            }

            alert(`Campaign "${campaignName}" uploaded!\nDuration: ${duration}s\nFile: ${selectedFile.name}`);
            closeDrawer();

            // Reset form
            e.target.reset();
            removeFile(new Event('click'));
        }
    </script>
</body>

</html>
