# Backend (Ad Server) Cloud Build Configuration
# Builds Docker image and deploys to Cloud Run with environment variables

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ad-server:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ad-server:latest'
      - '.'
    id: 'build-image'


  # Step 2: Push the Docker image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - 'gcr.io/$PROJECT_ID/ad-server:$BUILD_ID'
    id: 'push-image'
    waitFor: ['build-image']

  # Step 3: Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - 'gcr.io/$PROJECT_ID/ad-server:latest'
    id: 'push-latest'
    waitFor: ['build-image']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ad-server'
      - '--image=gcr.io/$PROJECT_ID/ad-server:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=PROJECT_ID=$PROJECT_ID,GCS_BUCKET=$PROJECT_ID.appspot.com'
      - '--set-secrets=JWT_SECRET=jwt-secret:latest'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--timeout=300s'
    id: 'deploy-to-cloud-run'
    waitFor: ['push-image']

  # Step 5: Get the deployed service URL (for frontend configuration)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Backend deployed successfully!"
        gcloud run services describe ad-server --region=us-central1 --format='value(status.url)' > /workspace/backend_url.txt
        echo "Backend URL: $(cat /workspace/backend_url.txt)"
    id: 'get-backend-url'
    waitFor: ['deploy-to-cloud-run']

# Store the built images
images:
  - 'gcr.io/$PROJECT_ID/ad-server:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/ad-server:latest'

# Configuration
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'  # 20 minutes
