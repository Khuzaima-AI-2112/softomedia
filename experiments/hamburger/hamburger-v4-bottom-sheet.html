<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Variant D — Bottom Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode:'class',
      theme:{ extend:{ colors:{ primary:'#01696f' }, fontFamily:{ sans:['Inter','sans-serif'] },
        keyframes:{ slideUp:{ from:{ transform:'translateY(100%)' }, to:{ transform:'translateY(0)' } } },
        animation:{ 'slide-up':'slideUp 220ms cubic-bezier(0.16,1,0.3,1)' }
      }}
    };
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <header class="sticky top-0 z-50 flex items-center gap-3 px-4 py-3 bg-slate-900 border-b border-slate-800">
    <button onclick="openDrawer()" aria-label="Open navigation menu"
      class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <span class="material-symbols-outlined text-primary text-[22px]">campaign</span>
    <span class="font-bold text-white">AdManager</span>
    <div class="ml-auto flex items-center gap-2">
      <a href="./hamburger-hub.html" class="text-xs text-slate-500 hover:text-slate-300 flex items-center gap-1">
        <span class="material-symbols-outlined text-[16px]">arrow_back</span> Hub
      </a>
      <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-lg hover:bg-slate-800 transition-colors">
        <span class="material-symbols-outlined text-[20px] text-slate-400">dark_mode</span>
      </button>
    </div>
  </header>

  <main class="p-8">
    <p class="text-slate-500 text-sm mb-1 font-semibold">Variant D — Bottom Sheet (Mobile-first)</p>
    <p class="text-slate-500 text-sm">Slides up from bottom. Capped at <code class="text-slate-300">max-h-[70vh]</code>. Horizontal swatch row for thumb reach.</p>
  </main>

  <div id="overlay" class="hidden fixed inset-0 z-[100] flex flex-col justify-end">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeDrawer()"></div>
    <div class="relative flex flex-col bg-white dark:bg-slate-900 rounded-t-2xl shadow-2xl max-h-[70vh] animate-slide-up"
      role="dialog" aria-modal="true" aria-label="Navigation menu">

      <div class="flex-shrink-0 flex justify-center pt-3 pb-1">
        <div class="w-10 h-1 rounded-full bg-slate-300 dark:bg-slate-700"></div>
      </div>

      <div class="flex-shrink-0 flex items-center justify-between px-5 py-3 border-b border-slate-200 dark:border-slate-700">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-[22px]">campaign</span>
          <span class="font-bold text-slate-900 dark:text-white">AdManager</span>
        </div>
        <button onclick="closeDrawer()" aria-label="Close"
          class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
      </div>

      <div class="flex-1 min-h-0 overflow-y-auto">
        <nav class="px-3 py-3 space-y-0.5 border-b border-slate-200 dark:border-slate-700">
          <a href="#" onclick="closeDrawer()" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            <span class="material-symbols-outlined text-[22px] text-slate-400">dashboard</span>Dashboard
          </a>
          <a href="#" onclick="closeDrawer()" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            <span class="material-symbols-outlined text-[22px] text-slate-400">slideshow</span>Demo Player
          </a>
          <a href="#" onclick="closeDrawer()" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            <span class="material-symbols-outlined text-[22px] text-slate-400">monitor_heart</span>Health
          </a>
        </nav>

        <div class="px-5 py-4 border-b border-slate-200 dark:border-slate-700">
          <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-widest mb-3">Switch Demo Role</p>
          <div class="flex gap-2 overflow-x-auto pb-1 snap-x" id="swatches-d"></div>
        </div>

        <div class="px-5 py-4">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-9 h-9 rounded-full bg-primary flex-shrink-0 flex items-center justify-center text-white font-bold">T</div>
            <div class="min-w-0">
              <p class="text-sm font-semibold text-slate-900 dark:text-white truncate">Tech Op</p>
              <p class="text-xs text-slate-400 truncate">tech@demo.softomedia.com</p>
            </div>
          </div>
          <button onclick="closeDrawer()"
            class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 border border-red-100 dark:border-red-900/30 transition-colors">
            <span class="material-symbols-outlined text-[18px]">logout</span>Log out
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SWATCHES = [
      { label:'Super Admin', role:'super_admin', color:'bg-purple-500' },
      { label:'Admin',       role:'admin',       color:'bg-blue-500'   },
      { label:'Brand',       role:'brand',       color:'bg-rose-500'   },
      { label:'Retailer',    role:'retailer',    color:'bg-amber-500'  },
      { label:'Tech Op',     role:'tech',        color:'bg-slate-500'  },
    ];
    let activeRole = 'tech';
    function buildSwatches() {
      const c = document.getElementById('swatches-d');
      c.innerHTML = SWATCHES.map(s => `
        <button data-swatch="${s.role}" onclick="setRole('${s.role}')" aria-pressed="${s.role===activeRole}"
          class="flex-shrink-0 snap-start flex flex-col items-center gap-1.5 px-3 py-2.5 rounded-xl text-xs font-medium transition-colors
          ${s.role===activeRole ? 'bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white ring-1 ring-slate-300 dark:ring-slate-600'
                                : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}">
          <span class="w-3 h-3 rounded-full ${s.color}"></span>
          <span class="whitespace-nowrap">${s.label}</span>
        </button>`).join('');
    }
    function setRole(role) { activeRole = role; buildSwatches(); }
    function openDrawer() {
      document.getElementById('overlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      buildSwatches();
    }
    function closeDrawer() {
      document.getElementById('overlay').classList.add('hidden');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if(e.key==='Escape') closeDrawer(); });
  </script>
</body>
</html>
