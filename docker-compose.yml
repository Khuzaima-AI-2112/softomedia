# Local Phase 1 demo: Firebase emulators + ad-server + client-app in Docker.
# Requires only Git and Docker Desktop — see README.md "Run the demo with Docker".
services:
  firebase-emulators:
    build:
      context: .
      dockerfile: firebase-emulators/Dockerfile
    ports:
      - "9099:9099" # Auth
      - "8090:8090" # Firestore
      - "9199:9199" # Storage

  # One-shot job: creates the seven demo Firebase sign-ins and loads the
  # synthetic demo baseline. Re-run it (`docker compose run --rm seed`) to
  # reset the demo back to that baseline.
  seed:
    build:
      context: ./ad-server
      dockerfile: Dockerfile
    command: ["sh", "-c", "node scripts/provision-demo-personas.js && node scripts/reset-demo.js"]
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      GOOGLE_CLOUD_PROJECT: softomedia-demo
      FIREBASE_PROJECT_ID: softomedia-demo
      DEMO_PROJECT_ID: softomedia-demo
      DEMO_ASSETS_BUCKET: softomedia-demo.firebasestorage.app
      FIRESTORE_EMULATOR_HOST: firebase-emulators:8090
      STORAGE_EMULATOR_HOST: http://firebase-emulators:9199
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulators:9099
    depends_on:
      firebase-emulators:
        condition: service_healthy

  ad-server:
    build:
      context: ./ad-server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      CORS_ORIGINS: http://localhost:3000
      GOOGLE_CLOUD_PROJECT: softomedia-demo
      FIREBASE_PROJECT_ID: softomedia-demo
      DEMO_PROJECT_ID: softomedia-demo
      DEMO_ASSETS_BUCKET: softomedia-demo.firebasestorage.app
      FIRESTORE_EMULATOR_HOST: firebase-emulators:8090
      STORAGE_EMULATOR_HOST: http://firebase-emulators:9199
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulators:9099
    depends_on:
      firebase-emulators:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  client-app:
    build:
      context: ./client-app
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      # Browser-facing addresses: the browser runs on the host, not in the
      # Docker network, so these must be the published localhost ports.
      VITE_API_URL: http://localhost:8080
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: softomedia-demo.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: softomedia-demo
      VITE_FIREBASE_AUTH_EMULATOR_URL: http://localhost:9099
      BUILD_ID: docker-demo
    depends_on:
      ad-server:
        condition: service_started
