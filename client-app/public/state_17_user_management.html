<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State 17: User Management | SoftoMedia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg-main: #f9fafb;
            --color-bg-card: #ffffff;
            --color-bg-hover: #f3f4f6;
            --color-primary: #6366f1;
            --color-success-light: #d1fae5;
            --color-text-primary: #111827;
            --color-text-secondary: #6b7280;
            --color-text-tertiary: #9ca3af;
            --color-border: #e5e7eb;
            --color-border-light: #f3f4f6;
            --font-body: 'Inter', sans-serif;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --radius-md: 0.5rem;
            --radius-full: 9999px;
            --shadow-md: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-bg-main);
        }

        .dashboard-ui {
            padding: var(--space-6);
            max-width: 1400px;
            margin: 0 auto;
        }

        .glass-card {
            background-color: var(--color-bg-card);
            padding: var(--space-6);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-6);
        }

        .btn-invite {
            padding: var(--space-3) var(--space-6);
            font-size: 0.875rem;
            font-weight: 600;
            color: white;
            background-color: var(--color-primary);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: transform 0.15s;
        }

        .btn-invite:hover {
            transform: translateY(-2px);
        }

        .tabs {
            border-bottom: 2px solid var(--color-border);
            margin-bottom: var(--space-6);
            display: flex;
            gap: var(--space-4);
        }

        .tab-btn {
            padding: var(--space-3) var(--space-4);
            font-size: 1rem;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            cursor: pointer;
            text-transform: capitalize;
            font-family: var(--font-body);
        }

        .tab-btn.active {
            font-weight: 600;
            color: var(--color-primary);
            border-bottom-color: var(--color-primary);
        }

        .tab-btn:not(.active) {
            color: var(--color-text-secondary);
            font-weight: 500;
        }

        table {
            width: 100%;
            text-align: left;
            border-collapse: collapse;
        }

        thead tr {
            border-bottom: 2px solid var(--color-border);
        }

        th {
            padding: var(--space-3);
            color: var(--color-text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        tbody tr {
            border-bottom: 1px solid var(--color-border-light);
            transition: background-color 0.15s;
        }

        tbody tr:hover {
            background-color: var(--color-bg-hover);
        }

        td {
            padding: var(--space-3);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-badge.active {
            background-color: var(--color-success-light);
            color: #03543f;
        }

        .status-badge.invited {
            background-color: #f3f4f6;
            color: #4b5563;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: var(--space-2);
        }

        .status-dot.active {
            background-color: #03543f;
        }

        .status-dot.invited {
            background-color: #4b5563;
        }

        .btn-view {
            padding: var(--space-2) var(--space-3);
            font-size: 0.75rem;
            color: var(--color-primary);
            background-color: transparent;
            border: 1px solid var(--color-primary);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-view:hover {
            background-color: var(--color-primary);
            color: white;
        }

        /* Drawer Overlay */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .drawer {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 500px;
            max-width: 90vw;
            background-color: white;
            box-shadow: var(--shadow-xl);
            z-index: 1001;
            flex-direction: column;
            animation: slideInRight 0.3s;
        }

        .drawer.open,
        .overlay.open {
            display: flex;
        }

        .drawer-header {
            padding: var(--space-6);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-6);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            color: var(--color-text-secondary);
            cursor: pointer;
            line-height: 1;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: var(--space-3);
            font-size: 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            outline: none;
            font-family: var(--font-body);
        }

        input:focus {
            border-color: var(--color-primary);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-ui">
        <div class="glass-card">
            <!-- Header -->
            <div class="header-row">
                <div>
                    <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">User Management</h1>
                    <p style="color: var(--color-text-secondary);">Manage network users and send invitations</p>
                </div>
                <button class="btn-invite" onclick="openDrawer()">
                    + <span id="inviteButtonText">Invite New Retailer</span>
                </button>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('retailers')">Retailers</button>
                <button class="tab-btn" onclick="switchTab('brands')">Brands</button>
                <button class="tab-btn" onclick="switchTab('admins')">Admins</button>
            </div>

            <!-- Table -->
            <div style="overflow-x: auto;">
                <table id="userTable">
                    <thead id="tableHeader"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Drawer -->
    <div class="overlay" id="overlay" onclick="closeDrawer()"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h2 id="drawerTitle" style="font-size: 1.25rem; font-weight: 600;">Invite New Retailer</h2>
            <button class="close-btn" onclick="closeDrawer()">×</button>
        </div>
        <div class="drawer-content">
            <form onsubmit="handleInvite(event)">
                <div style="margin-bottom: var(--space-6);">
                    <label
                        style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: var(--space-2);">
                        Contact Name *
                    </label>
                    <input type="text" id="inviteName" placeholder="John Smith" required>
                </div>
                <div style="margin-bottom: var(--space-6);">
                    <label
                        style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: var(--space-2);">
                        Email *
                    </label>
                    <input type="email" id="inviteEmail" placeholder="john@business.com" required>
                </div>
                <div style="margin-bottom: calc(var(--space-6) * 2);">
                    <label
                        style="display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: var(--space-2);">
                        <span id="businessLabel">Business Name</span> *
                    </label>
                    <input type="text" id="inviteBusiness" placeholder="Pizza Hut Downtown" required>
                    <p style="font-size: 0.75rem; color: var(--color-text-secondary); margin-top: var(--space-2);">
                        An email invitation will be sent to set up their password
                    </p>
                </div>
                <div style="display: flex; gap: var(--space-3); justify-content: flex-end;">
                    <button type="button" onclick="closeDrawer()"
                        style="padding: var(--space-3) var(--space-6); font-size: 1rem; font-weight: 500; color: var(--color-text-secondary); background: transparent; border: 1px solid var(--color-border); border-radius: var(--radius-md); cursor: pointer;">
                        Cancel
                    </button>
                    <button type="submit"
                        style="padding: var(--space-3) calc(var(--space-6) * 1.5); font-size: 1rem; font-weight: 600; color: white; background: var(--color-primary); border: none; border-radius: var(--radius-md); cursor: pointer;">
                        Send Invitation
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const userData = {
            retailers: [
                { name: 'John Smith', email: 'john@pizzahut.com', business: 'Pizza Hut Downtown', metric: 3, status: 'active' },
                { name: 'Sarah Johnson', email: 'sarah@walmart.com', business: 'Walmart Supercenter', metric: 12, status: 'active' },
                { name: 'Mike Chen', email: 'mike@target.com', business: 'Target Store #543', metric: 0, status: 'invited' },
            ],
            brands: [
                { name: 'Emily Davis', email: 'emily@cocacola.com', business: 'Coca-Cola Company', metric: 5, status: 'active' },
                { name: 'Robert Wilson', email: 'robert@pepsi.com', business: 'PepsiCo', metric: 3, status: 'active' },
                { name: 'Lisa Brown', email: 'lisa@nike.com', business: 'Nike Inc.', metric: 0, status: 'invited' },
            ],
            admins: [
                { name: 'Admin User', email: 'admin@softomedia.net', business: 'SoftoMedia', metric: 'Super Admin', status: 'active' },
            ],
        };

        let currentTab = 'retailers';

        function switchTab(tab) {
            currentTab = tab;

            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Update invite button text
            const inviteTexts = {
                retailers: 'Invite New Retailer',
                brands: 'Invite New Brand',
                admins: 'Add New Admin'
            };
            document.getElementById('inviteButtonText').textContent = inviteTexts[tab];

            renderTable();
        }

        function renderTable() {
            const headers = {
                retailers: ['Business Name', 'Contact Person', 'Email', 'Screens Deployed', 'Status', 'Actions'],
                brands: ['Company Name', 'Contact Person', 'Email', 'Active Campaigns', 'Status', 'Actions'],
                admins: ['Name', 'Email', 'Role', 'Status', 'Actions']
            };

            const thead = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');

            // Render headers
            thead.innerHTML = '<tr>' + headers[currentTab].map(h => `<th>${h}</th>`).join('') + '</tr>';

            // Render rows
            const users = userData[currentTab];
            tbody.innerHTML = users.map(user => `
                <tr>
                    ${currentTab !== 'admins' ? `<td style="font-weight: 500;">${user.business}</td>` : ''}
                    <td${currentTab === 'admins' ? ' style="font-weight: 500;"' : ''}>${user.name}</td>
                    <td style="color: var(--color-text-secondary); font-size: 0.875rem;">${user.email}</td>
                    <td>${user.metric}</td>
                    <td>
                        <span class="status-badge ${user.status}">
                            <span class="status-dot ${user.status}"></span>
                            ${user.status === 'active' ? 'Active' : 'Invited'}
                        </span>
                    </td>
                    <td>
                        <button class="btn-view" onclick="alert('View details for ${user.name}')">View</button>
                    </td>
                </tr>
            `).join('');
        }

        function openDrawer() {
            const titles = {
                retailers: 'Invite New Retailer',
                brands: 'Invite New Brand',
                admins: 'Add New Admin'
            };
            const businessLabels = {
                retailers: 'Business Name',
                brands: 'Company Name',
                admins: 'Role'
            };

            document.getElementById('drawerTitle').textContent = titles[currentTab];
            document.getElementById('businessLabel').textContent = businessLabels[currentTab];
            document.getElementById('overlay').classList.add('open');
            document.getElementById('drawer').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('overlay').classList.remove('open');
            document.getElementById('drawer').classList.remove('open');
        }

        function handleInvite(e) {
            e.preventDefault();
            const name = document.getElementById('inviteName').value;
            const email = document.getElementById('inviteEmail').value;
            const business = document.getElementById('inviteBusiness').value;

            alert(`Invitation sent to ${email}\n\nContact: ${name}\nBusiness: ${business}\n\nThey will receive an email to set up their account.`);

            // Reset form
            e.target.reset();
            closeDrawer();
        }

        // Initial render
        renderTable();
    </script>
</body>

</html>
