<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State 10 & 18: Retailer Dashboard | SoftoMedia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg-main: #f9fafb;
            --color-bg-card: #ffffff;
            --color-bg-hover: #f3f4f6;
            --color-primary: #6366f1;
            --color-success: #10b981;
            --color-success-light: #d1fae5;
            --color-error: #dc2626;
            --color-error-light: #fee2e2;
            --color-text-primary: #111827;
            --color-text-secondary: #6b7280;
            --color-text-tertiary: #9ca3af;
            --color-border: #e5e7eb;
            --font-body: 'Inter', sans-serif;
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --shadow-md: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-bg-main);
            color: var(--color-text-primary);
        }

        .dashboard-ui {
            padding: var(--space-6);
            max-width: 800px;
            margin: 0 auto;
        }

        .glass-card {
            background-color: var(--color-bg-card);
            padding: var(--space-6);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            margin-bottom: var(--space-8);
            text-align: center;
        }

        .status-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-6);
        }

        .status-circle.online {
            background-color: var(--color-success-light);
        }

        .status-circle.offline {
            background-color: var(--color-error-light);
        }

        .troubleshoot-btn {
            width: 100%;
            padding: var(--space-6);
            font-size: 1rem;
            font-weight: 500;
            color: var(--color-text-primary);
            background-color: var(--color-bg-hover);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            min-height: 80px;
            margin-bottom: var(--space-4);
        }

        .troubleshoot-btn:hover {
            border-color: var(--color-primary);
            background-color: white;
        }

        .troubleshoot-btn.primary {
            background-color: var(--color-primary);
            color: white;
            border: none;
            font-weight: 600;
        }

        .troubleshoot-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .toggle-btn {
            padding: var(--space-3) var(--space-6);
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            background-color: transparent;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            margin-top: var(--space-8);
        }

        .earnings-value {
            font-size: 3rem;
            font-weight: 700;
            color: var(--color-success);
            font-variant-numeric: tabular-nums;
        }

        .cta-btn {
            margin-top: var(--space-6);
            padding: var(--space-4) var(--space-8);
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background-color: var(--color-primary);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.25s;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
    </style>
</head>

<body>
    <div class="dashboard-ui">
        <div style="margin-bottom: var(--space-6);">
            <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">My Store</h1>
            <p style="color: var(--color-text-secondary); font-size: 0.875rem;">Quick overview of your screen system</p>
        </div>

        <!-- Online State (State 10) -->
        <div id="onlineView">
            <div class="glass-card">
                <div class="status-circle online">
                    <span style="font-size: 4rem; color: var(--color-success);">✓</span>
                </div>
                <h2
                    style="font-size: 1.875rem; font-weight: 700; color: var(--color-success); margin-bottom: var(--space-3);">
                    System Online
                </h2>
                <p style="font-size: 1.125rem; color: var(--color-text-secondary); margin-bottom: 0.5rem;">
                    Your screen is active
                </p>
                <p style="font-size: 0.875rem; color: var(--color-text-tertiary);">
                    Downtown Store • 99.8% uptime
                </p>
            </div>

            <div class="glass-card">
                <p style="font-size: 0.875rem; color: var(--color-text-secondary); margin-bottom: var(--space-3);">
                    Estimated Earnings This Month
                </p>
                <p class="earnings-value">$1,245.50</p>
                <button class="cta-btn" onclick="alert('Navigate to earnings details')">
                    View Earnings Details
                </button>
            </div>
        </div>

        <!-- Offline State (State 10 + 18) -->
        <div id="offlineView" style="display: none;">
            <div class="glass-card">
                <div class="status-circle offline">
                    <span style="font-size: 4rem; color: var(--color-error);">⚠️</span>
                </div>
                <h2
                    style="font-size: 1.875rem; font-weight: 700; color: var(--color-error); margin-bottom: var(--space-3);">
                    Needs Attention
                </h2>
                <p style="font-size: 1.125rem; color: var(--color-text-secondary);">
                    Screen Offline
                </p>
            </div>

            <!-- State 18: Troubleshoot Buttons -->
            <div class="glass-card">
                <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: var(--space-6);">
                    Quick Troubleshooting
                </h3>

                <button class="troubleshoot-btn"
                    onclick="alert('Wi-Fi Checklist:\n\n1. Check Wi-Fi connection\n2. Verify router is on\n3. Test other devices\n4. Reset router if needed')">
                    <div style="font-size: 1.5rem; margin-bottom: var(--space-2);">📶</div>
                    <div style="font-weight: 600;">Did the store lose Wi-Fi?</div>
                    <div style="font-size: 0.875rem; color: var(--color-text-secondary); margin-top: var(--space-1);">
                        Tap to see Wi-Fi troubleshooting steps
                    </div>
                </button>

                <button class="troubleshoot-btn"
                    onclick="alert('Power Check:\n\n• TV is plugged in\n• Power strip is on\n• No tripped breakers\n• Check cable connections')">
                    <div style="font-size: 1.5rem; margin-bottom: var(--space-2);">🔌</div>
                    <div style="font-weight: 600;">Is the TV unplugged?</div>
                    <div style="font-size: 0.875rem; color: var(--color-text-secondary); margin-top: var(--space-1);">
                        Tap to see power connection guide
                    </div>
                </button>

                <button class="troubleshoot-btn primary" onclick="reportIssue()">
                    <div style="font-size: 1.5rem; margin-bottom: var(--space-2);">📝</div>
                    <div>Report Issue to Support</div>
                    <div style="font-size: 0.875rem; opacity: 0.9; margin-top: var(--space-1);">
                        Our team will contact you within 1 hour
                    </div>
                </button>
            </div>
        </div>

        <!-- Toggle Button -->
        <div style="text-align: center;">
            <button class="toggle-btn" onclick="toggleStatus()">
                Toggle Status (Demo)
            </button>
        </div>
    </div>

    <script>
        let isOnline = true;

        function toggleStatus() {
            isOnline = !isOnline;
            document.getElementById('onlineView').style.display = isOnline ? 'block' : 'none';
            document.getElementById('offlineView').style.display = isOnline ? 'none' : 'block';
        }

        function reportIssue() {
            const issue = prompt('Tell us what you see:');
            if (issue && issue.trim()) {
                alert(`Report Submitted!\n\nYour Issue: ${issue}\n\nOur support team has been notified and will contact you shortly.\n\nExpected response time: Within 1 hour during business hours`);
            }
        }
    </script>
</body>

</html>
